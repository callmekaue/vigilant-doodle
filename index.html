                <div key={e.id} className="card" style={{ padding:14 }}>
                  <div style={{ display:'flex', gap:8, alignItems:'center', marginBottom:5 }}>
                    <StatusBadge tone="muted"><CategoryDot category={e.category}/> {e.category}</StatusBadge>
                    <span style={{ fontSize:11.5, color:'var(--text-faint)' }}>{fmtDate(e.date)}{student?` · ${student.name}`:''}</span>
                  </div>
                  <div style={{ fontSize:13.5 }}>{e.description}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {tab==='history' && (
        <div className="fade-up card" style={{ padding:18 }}>
          <HistoryTimeline db={db} items={db.studentHistory.filter(h=>h.fromGroupId===group.id || h.toGroupId===group.id).map(h=>({...h,kind:'aluno'}))} emptyText="Nenhuma movimentação de alunos registrada." />
        </div>
      )}

      {tab==='changes' && (
        <div className="fade-up card" style={{ padding:18 }}>
          <HistoryTimeline db={db} items={db.groupHistory.filter(h=>h.groupId===group.id).map(h=>({...h,kind:'grupo'}))} emptyText="Nenhuma alteração registrada." />
        </div>
      )}

      {leaderModal && (
        <Modal title="Alterar líder" onClose={()=>setLeaderModal(false)}>
          <div style={{ display:'flex', flexDirection:'column', gap:6 }}>
            <div onClick={()=>{ actions.setLeader(group.id, null); setLeaderModal(false); }} className="sidebar-link" style={{ cursor:'pointer', color:'var(--text)' }}>Nenhum líder</div>
            {members.map(m=>(
              <div key={m.id} onClick={()=>{ actions.setLeader(group.id, m.id); setLeaderModal(false); }} className="sidebar-link" style={{ cursor:'pointer', color:'var(--text)', justifyContent:'space-between' }}>
                <span>{m.name}</span>{group.leaderId===m.id && <LeaderBadge/>}
              </div>
            ))}
          </div>
        </Modal>
      )}
      {renameModal && <RenameGroupModal ctx={ctx} group={group} onClose={()=>setRenameModal(false)} />}
      {gradeModal && <GroupGradeModal ctx={ctx} group={group} onClose={()=>setGradeModal(false)} />}
      {diaryModal && <DiaryFormModal ctx={ctx} classId={group.classId} fixedGroup={group} onClose={()=>setDiaryModal(false)} />}
      {addStudentModal && <AddExistingOrNewStudent ctx={ctx} group={group} onClose={()=>setAddStudentModal(false)} />}
      {transferring && <TransferModal ctx={ctx} student={transferring} onClose={()=>setTransferring(null)} />}
    </div>
  );
}

function RenameGroupModal({ ctx, group, onClose }){
  const { actions } = ctx;
  const [name, setName] = useState(group.name);
  return (
    <Modal title="Renomear grupo" onClose={onClose} footer={
      <React.Fragment><button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
      <button className="btn btn-primary" onClick={()=>{ actions.renameGroup(group.id, name); onClose(); }}>Salvar</button></React.Fragment>
    }>
      <Field label="Novo nome"><input value={name} onChange={e=>setName(e.target.value)} autoFocus /></Field>
    </Modal>
  );
}

function AddExistingOrNewStudent({ ctx, group, onClose }){
  const { db, actions, notify } = ctx;
  const [mode, setMode] = useState('existing');
  const others = db.students.filter(s=> s.classId===group.classId && s.status==='ativo' && s.groupId!==group.id);
  const [pickId, setPickId] = useState(others[0] ? others[0].id : '');
  const [name, setName] = useState('');
  const [rgm, setRgm] = useState('');

  const submit = ()=>{
    if(mode==='existing'){
      if(!pickId) return;
      actions.transferStudent(pickId, group.id);
      onClose();
    } else {
      const id = actions.addStudent(group.classId, { name, rgm, groupId: group.id });
      if(id) onClose();
    }
  };

  return (
    <Modal title={`Adicionar aluno ao ${group.name}`} onClose={onClose} footer={
      <React.Fragment>
        <button className="btn btn-ghost" onClick={onClose}>Cancelar</button>
        <button className="btn btn-primary" disabled={mode==='existing' && !pickId} onClick={submit}>Adicionar</button>
      </React.Fragment>
    }>
      <div className="card" style={{ display:'inline-flex', padding:3, gap:2, marginBottom:14 }}>
        <button onClick={()=>setMode('existing')} className="btn btn-sm" style={{ background: mode==='existing'?'var(--surface-2)':'transparent', color: mode==='existing'?'var(--text)':'var(--text-muted)' }}>Aluno já cadastrado</button>
        <button onClick={()=>setMode('new')} className="btn btn-sm" style={{ background: mode==='new'?'var(--surface-2)':'transparent', color: mode==='new'?'var(--text)':'var(--text-muted)' }}>Novo aluno</button>
      </div>
      {mode==='existing' ? (
        <Field label="Selecionar aluno">
          <select value={pickId} onChange={e=>setPickId(e.target.value)}>
            {others.map(s=> <option key={s.id} value={s.id}>{s.name} ({db.groups.find(g=>g.id===s.groupId)?.name || 'sem grupo'})</option>)}
          </select>
          {others.length===0 && <div style={{ fontSize:12, color:'var(--text-faint)', marginTop:6 }}>Não há outros alunos nesta turma.</div>}
        </Field>
      ) : (
        <React.Fragment>
          <Field label="Nome completo"><input value={name} onChange={e=>setName(e.target.value)} placeholder="Ex.: João Silva" autoFocus /></Field>
          <Field label="RGM"><input value={rgm} onChange={e=>setRgm(e.target.value)} placeholder="Ex.: 123456" /></Field>
        </React.Fragment>
      )}
    </Modal>
  );
}

/* ============================================================
   PERFIL DO ALUNO
   ============================================================ */
function StudentScreen({ ctx, studentId }){
  const { db, navigate, actions } = ctx;
  const student = db.students.find(s=>s.id===studentId);
  const [editing, setEditing] = useState(false);
  if(!student) return <EmptyState text="Aluno não encontrado." />;
  const cls = db.classes.find(c=>c.id===student.classId);
  const group = student.groupId ? db.groups.find(g=>g.id===student.groupId) : null;
  const grades = db.individualGrades.filter(g=>g.studentId===student.id);
  const diary = db.diaryEntries.filter(d=>d.studentId===student.id);
  const history = db.studentHistory.filter(h=>h.studentId===student.id).sort((a,b)=> a.date<b.date?1:-1);

  const gradeChartData = {
    labels: grades.map(g=>fmtDate(g.date)),
    datasets:[{ label:'Nota', data: grades.map(g=>g.value), borderColor:'#E7A93F', backgroundColor:'#E7A93F33', tension:.35, pointRadius:3, fill:true }]
  };

  return (
    <div className="fade-up">
      <button onClick={()=> group ? navigate('group',{groupId:group.id}) : navigate('day',{classId:student.classId})} className="btn btn-ghost btn-sm" style={{ marginBottom:14 }}><Icon path={ICONS.arrowLeft} size={14}/> Voltar</button>

      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:12 }}>
        <div>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <h1 style={{ fontSize:24, margin:0, fontWeight:600 }}>{student.name}</h1>
            {group && group.leaderId===student.id && <LeaderBadge size={20}/>}
          </div>
          <div style={{ color:'var(--text-muted)', fontSize:13, marginTop:6, display:'flex', gap:12, flexWrap:'wrap' }}>
            <span>RGM {student.rgm}</span><span>·</span><span>{cls.name}</span><span>·</span><span>{group ? group.name : 'Sem grupo'}</span>
          </div>
        </div>
        <div style={{ display:'flex', gap:8 }}>
          <button className="btn btn-soft btn-sm" onClick={()=>setEditing(true)}><Icon path={ICONS.edit} size={14}/> Editar</button>
          <button className="btn btn-soft btn-sm" onClick={()=>navigate('reports',{ studentId: student.id, classId: student.classId })}><Icon path={ICONS.file} size={14}/> Relatório individual</button>
        </div>
      </div>

      {student.observations && (
        <div className="card" style={{ padding:14, marginTop:16, borderLeft:'3px solid var(--indigo)' }}>
          <div style={{ fontSize:11, color:'var(--text-faint)', marginBottom:4 }}>OBSERVAÇÕES</div>
          <div style={{ fontSize:13.5, lineHeight:1.5 }}>{student.observations}</div>
        </div>
      )}

      <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:16, marginTop:20 }} className="grid-stack">
        <div className="card" style={{ padding:18 }}>
          <h3 style={{ margin:'0 0 14px', fontSize:15, fontWeight:600 }}>Evolução das notas</h3>
          {grades.length ? <ChartCanvas type="line" data={gradeChartData} height={200} /> : <EmptyState small text="Nenhuma nota lançada ainda." />}
        </div>
        <div className="card" style={{ padding:18 }}>
          <h3 style={{ margin:'0 0 14px', fontSize:15, fontWeight:600 }}>Histórico de grupos</h3>
          {history.length===0 ? <EmptyState small text="Nenhuma mudança de grupo registrada." /> : (
            <div style={{ display:'flex', flexDirection:'column', gap:0 }}>
              {history.slice().reverse().map((h,i)=>{
                const to = db.groups.find(g=>g.id===h.toGroupId);
                const isCurrent = i===history.length-1;
                return (
                  <div key={h.id} style={{ display:'flex', alignItems:'center', gap:8, padding:'7px 0' }}>
                    <span style={{ width:8, height:8, borderRadius:99, background: isCurrent?'var(--success)':'var(--border)', flexShrink:0 }}/>
                    <div style={{ flex:1 }}>
                      <div style={{ fontSize:13 }}>{to ? to.name : 'Sem grupo'} {isCurrent && <StatusBadge tone="success">atual</StatusBadge>}</div>
                      <div style={{ fontSize:11, color:'var(--text-faint)' }}>{fmtDate(h.date)}</div>
                    </div>

        <h3 style={{ margin:'0 0 12px', fontSize:15, fontWeight:600 }}>Registros do diário</h3>

          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            {diary.map(e=>{
              const g = e.groupId ? db.groups.find(x=>x.id===e.groupId) : null;
              return (
                <div key={e.id} style={{ display:'flex', gap:10, borderBottom:'1px solid var(--border-soft)', paddingBottom:10 }}>
                  <CategoryDot category={e.category}/>
                  <div>
                    <div style={{ fontSize:13 }}>{e.description}</div>
                    <div style={{ fontSize:11, color:'var(--text-faint)', marginTop:2 }}>{fmtDate(e.date)} · {e.category}{g?` · registrado no ${g.name}`:''}</div>

      {editing && <StudentFormModal ctx={ctx} classId={student.classId} student={student} onClose={()=>setEditing(false)} />}
    </div>
  );
}

/* ============================================================
   RELATÓRIOS + PDF
   ============================================================ */
function ReportsScreen({ ctx, initial }){
  const { db, actions, notify } = ctx;
  const [classId, setClassId] = useState(initial.classId || '');
  const [groupId, setGroupId] = useState(initial.groupId || '');
  const [studentId, setStudentId] = useState(initial.studentId || '');
  const [dateStart, setDateStart] = useState('');
  const [dateEnd, setDateEnd] = useState('');
  const [category, setCategory] = useState('');
  const [reportType, setReportType] = useState('turma');

  const groups = db.groups.filter(g=> !classId || g.classId===classId);
  const students = db.students.filter(s=> s.status==='ativo' && (!classId || s.classId===classId) && (!groupId || s.groupId===groupId));

  const applyType = (type)=>{
    setReportType(type);
    if(type==='individual' && !studentId && students[0]) setStudentId(students[0].id);
  };

  const buildFilteredData = ()=>{
    let studs = db.students.filter(s=> s.status==='ativo');
    if(classId) studs = studs.filter(s=>s.classId===classId);
    if(groupId) studs = studs.filter(s=>s.groupId===groupId);
    if(studentId) studs = studs.filter(s=>s.id===studentId);

    let diary = db.diaryEntries.slice();
    if(classId) diary = diary.filter(d=>d.classId===classId);
    if(groupId) diary = diary.filter(d=>d.groupId===groupId);
    if(studentId) diary = diary.filter(d=>d.studentId===studentId);
    if(category) diary = diary.filter(d=>d.category===category);
    if(dateStart) diary = diary.filter(d=>d.date>=dateStart);
    if(dateEnd) diary = diary.filter(d=>d.date<=dateEnd);

    return { studs, diary };
  };

  const generatePDF = ()=>{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    const { studs, diary } = buildFilteredData();
    const clsName = classId ? db.classes.find(c=>c.id===classId).name : 'Todas as turmas';
    const groupName = groupId ? db.groups.find(g=>g.id===groupId).name : null;
    const studentName = studentId ? db.students.find(s=>s.id===studentId).name : null;

    doc.setFontSize(16);
    doc.text(`Relatório — ${studentName || groupName || clsName}`, 14, 18);
    doc.setFontSize(10); doc.setTextColor(110);
    const periodo = (dateStart||dateEnd) ? `${dateStart?fmtDate(dateStart):'início'} → ${dateEnd?fmtDate(dateEnd):'hoje'}` : 'Todo o período';
    doc.text(`Período: ${periodo}`, 14, 25);
    doc.text(`Gerado em ${fmtDate(todayISO())}`, 14, 30);

    const groupGrade = groupId ? db.groups.find(g=>g.id===groupId).groupGrade : null;
    const mediaInd = avg(studs.map(s=>{ const gr = db.individualGrades.filter(g=>g.studentId===s.id); return gr.length ? gr[gr.length-1].value : null; }));
    const mediaGrupos = avg((groupId ? [db.groups.find(g=>g.id===groupId)] : db.groups.filter(g=> !classId || g.classId===classId)).map(g=>g&&g.groupGrade));

    doc.setFontSize(12); doc.setTextColor(20);
    doc.text('Resumo', 14, 40);
    doc.setFontSize(10); doc.setTextColor(80);
    let y = 46;
    doc.text(`Total de alunos: ${studs.length}`, 14, y); y+=5;
    if(!studentId){ doc.text(`Total de grupos: ${groupId?1:(new Set(studs.map(s=>s.groupId))).size}`, 14, y); y+=5; }
    doc.text(`Média individual: ${mediaInd===null?'—':fmtGrade(mediaInd)}`, 14, y); y+=5;
    doc.text(`Média dos grupos: ${mediaGrupos===null?'—':fmtGrade(mediaGrupos)}`, 14, y); y+=8;

    doc.autoTable({
      startY: y+2,
      head: [['Nome','RGM','Grupo','Líder','Nota individual','Nota do grupo']],
      body: studs.map(s=>{
        const g = db.groups.find(x=>x.id===s.groupId);
        const gr = db.individualGrades.filter(x=>x.studentId===s.id);
        const last = gr.length ? gr[gr.length-1].value : null;
        return [ s.name, s.rgm, g?g.name:'—', (g&&g.leaderId===s.id)?'Sim':'Não', fmtGrade(last), g?fmtGrade(g.groupGrade):'—' ];
      }),
      styles:{ fontSize:8.5 }, headStyles:{ fillColor:[30,33,45] }, margin:{ left:14, right:14 }
    });

    let y2 = doc.lastAutoTable.finalY + 10;
    doc.setFontSize(12); doc.setTextColor(20);
    doc.text('Diário', 14, y2);
    doc.autoTable({
      startY: y2+4,
      head: [['Data','Grupo','Aluno','Categoria','Registro']],
      body: diary.map(d=>{
        const g = db.groups.find(x=>x.id===d.groupId);
        const st = d.studentId ? db.students.find(x=>x.id===d.studentId) : null;
        return [ fmtDate(d.date), g?g.name:'—', st?st.name:'Grupo inteiro', d.category, d.description ];
      }),
      styles:{ fontSize:8, cellWidth:'wrap' }, headStyles:{ fillColor:[30,33,45] }, margin:{ left:14, right:14 },
      columnStyles:{ 4:{ cellWidth:70 } }
    });

    const filename = `relatorio_${(studentName||groupName||clsName).toLowerCase().replace(/[^a-z0-9]+/g,'_')}.pdf`;
    doc.save(filename);
    notify('PDF gerado com sucesso.', 'success');
  };

  return (
    <div className="fade-up">
      <h1 style={{ fontSize:24, margin:'0 0 4px', fontWeight:600 }}>Central de Relatórios</h1>
      <p style={{ margin:'0 0 20px', color:'var(--text-muted)', fontSize:13.5 }}>Filtre os dados e gere um PDF profissional.</p>

      <div style={{ display:'flex', gap:8, marginBottom:20, flexWrap:'wrap' }}>
        {[['turma','Turma completa'],['group','Grupo'],['individual','Individual'],['grades','Notas'],['diary','Diário'],['history','Histórico']].map(([id,label])=>(
          <button key={id} className="btn btn-sm" onClick={()=>applyType(id)} style={{ background: reportType===id?'var(--accent)':'var(--surface-2)', color: reportType===id?'#241705':'var(--text-muted)', border:'1px solid var(--border)' }}>{label}</button>
        ))}
      </div>

      <div className="card" style={{ padding:18, marginBottom:20 }}>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit,minmax(160px,1fr))', gap:14 }}>
          <Field label="Dia / turma"><select value={classId} onChange={e=>{ setClassId(e.target.value); setGroupId(''); setStudentId(''); }}><option value="">Todas</option>{DIAS.map(d=> <option key={d.id} value={d.id}>{d.nome}</option>)}</select></Field>
          <Field label="Grupo"><select value={groupId} onChange={e=>{ setGroupId(e.target.value); setStudentId(''); }}><option value="">Todos</option>{groups.map(g=> <option key={g.id} value={g.id}>{g.name}</option>)}</select></Field>
          <Field label="Aluno"><select value={studentId} onChange={e=>setStudentId(e.target.value)}><option value="">Todos</option>{students.map(s=> <option key={s.id} value={s.id}>{s.name}</option>)}</select></Field>
          <Field label="Categoria (diário)"><select value={category} onChange={e=>setCategory(e.target.value)}><option value="">Todas</option>{db.categories.map(c=> <option key={c} value={c}>{c}</option>)}</select></Field>
          <Field label="Data inicial"><input type="date" value={dateStart} onChange={e=>setDateStart(e.target.value)} /></Field>
          <Field label="Data final"><input type="date" value={dateEnd} onChange={e=>setDateEnd(e.target.value)} /></Field>
        </div>
        <div style={{ display:'flex', justifyContent:'flex-end', marginTop:6 }}>
          <button className="btn btn-primary" onClick={generatePDF}><Icon path={ICONS.download} size={15}/> Gerar PDF</button>
        </div>
      </div>

      <div className="card" style={{ padding:18, marginBottom:20 }}>
        <div style={{ display:'flex', alignItems:'center', gap:8, marginBottom:4 }}>
          <Icon path={ctx.sync.status==='connected' ? ICONS.database : ICONS.cloudOff} size={16} style={{ color: ctx.sync.status==='connected' ? 'var(--success)' : 'var(--text-faint)' }}/>
          <h3 style={{ margin:0, fontSize:14, fontWeight:600 }}>Banco de dados</h3>
        </div>
        <p style={{ margin:'6px 0 12px', fontSize:12.5, color:'var(--text-muted)' }}>
          {ctx.sync.status==='connected' ? 'Conectado a um banco SQL — os dados são acessíveis de qualquer dispositivo com as mesmas credenciais.' : 'Salvando apenas neste navegador (localStorage). Conecte um banco SQL para acessar de outros dispositivos.'}
        </p>
        <button className="btn btn-soft btn-sm" onClick={()=>ctx.setModal({ type:'dbSettings' })}>{ctx.sync.status==='connected' ? 'Gerenciar conexão' : 'Conectar banco de dados'}</button>
      </div>

      <div className="card" style={{ padding:18, borderColor:'#F1685E33' }}>
        <h3 style={{ margin:'0 0 6px', fontSize:14, fontWeight:600, color:'#FCA79E' }}>Zona de dados</h3>
        <p style={{ margin:'0 0 12px', fontSize:12.5, color:'var(--text-muted)' }}>
          {db.meta && db.meta.demo ? 'Você está usando dados de exemplo (gerados manualmente para teste).' : 'Base real — sem dados de exemplo.'}
        </p>
        <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
          <button className="btn btn-soft btn-sm" onClick={()=> ctx.askConfirm({ title:'Carregar dados de exemplo', message:'Isso substituirá TODOS os dados atuais por um conjunto de exemplo (alunos, grupos e notas fictícios), só para teste' + (ctx.sync.status==='connected' ? ' — inclusive no banco SQL conectado.' : '.') + ' Deseja continuar?', confirmLabel:'Carregar exemplo', onConfirm: actions.resetDemoData })}>Carregar dados de exemplo (opcional, para teste)</button>
          <button className="btn btn-danger btn-sm" onClick={()=> ctx.askConfirm({ title:'Limpar todos os dados', tone:'danger', message:'Isso apagará todos os grupos, alunos, notas e diário' + (ctx.sync.status==='connected' ? ' — inclusive no banco SQL conectado.' : '.') + ' As 6 turmas e categorias serão mantidas vazias, prontas para você começar do zero. Esta ação não pode ser desfeita.', confirmLabel:'Apagar tudo', onConfirm: actions.clearAllData })}>Limpar tudo e começar do zero</button>
        </div>
      </div>
    </div>
  );
}

/* ============================================================
   BUSCA GLOBAL
   ============================================================ */
function SearchScreen({ ctx, query }){
  const { db, navigate } = ctx;
  const q = query.trim().toLowerCase();
  const students = db.students.filter(s=> s.status==='ativo' && (s.name.toLowerCase().includes(q) || s.rgm.includes(q.trim())));
  const groups = db.groups.filter(g=> g.status==='ativo' && g.name.toLowerCase().includes(q));

  return (
    <div className="fade-up">
      <h1 style={{ fontSize:22, margin:'0 0 4px', fontWeight:600 }}>Resultados para "{query}"</h1>
      <p style={{ margin:'0 0 20px', color:'var(--text-muted)', fontSize:13 }}>{students.length + groups.length} resultado(s) encontrado(s)</p>

      {groups.length>0 && (
        <div style={{ marginBottom:22 }}>
          <h3 style={{ fontSize:14, fontWeight:600, marginBottom:10 }}>Grupos</h3>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(220px,1fr))', gap:12 }}>
            {groups.map(g=>{
              const cls = db.classes.find(c=>c.id===g.classId);
              const count = db.students.filter(s=>s.groupId===g.id && s.status==='ativo').length;
              return (
                <div key={g.id} onClick={()=>navigate('group',{groupId:g.id})} className="card card-hover" style={{ padding:14, cursor:'pointer' }}>
                  <div style={{ fontWeight:700 }}>{g.name}</div>
                  <div style={{ fontSize:12, color:'var(--text-faint)', marginTop:4 }}>{cls.name} · {count} integrantes</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {students.length>0 && (
        <div>
          <h3 style={{ fontSize:14, fontWeight:600, marginBottom:10 }}>Alunos</h3>
          <div className="card" style={{ overflowX:'auto' }}>
            <table>
              <thead><tr><th>Nome</th><th>RGM</th><th>Turma</th><th>Grupo</th></tr></thead>
              <tbody>
                {students.map(s=>{
                  const cls = db.classes.find(c=>c.id===s.classId);
                  const group = db.groups.find(g=>g.id===s.groupId);
                  return (
                    <tr key={s.id} onClick={()=>navigate('student',{studentId:s.id})} style={{ cursor:'pointer' }}>
                      <td style={{ fontWeight:600 }}>{s.name}</td><td>{s.rgm}</td><td>{cls.name}</td><td>{group?group.name:'—'}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        </div>
      )}

      {students.length===0 && groups.length===0 && <EmptyState text="Nada encontrado. Tente outro termo." />}
    </div>
  );
}

/* ============================================================
